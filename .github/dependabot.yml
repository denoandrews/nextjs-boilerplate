version: 2
updates:
  # Minor and patch version updates share one pull request.
  # Major updates are left ungrouped so each opens on its own.
  # This group applies to version updates only. Security update
  # pull requests stay separate and also require Dependabot
  # alerts and Dependabot security updates in repository settings.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
